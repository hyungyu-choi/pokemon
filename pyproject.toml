[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pokechamp"
version = "0.1.0"
description = "Pokemon Champions battle simulator (exact Showdown champions-mod port) with self-learning battle and team-building AI"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
ai = ["torch"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["pokechamp*"]

[tool.setuptools.package-data]
pokechamp = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
